[package]
name = "dictation-app"
version = "0.1.0"
description = "Desktop English dictation practice with Azure or ElevenLabs TTS"
edition = "2021"
rust-version = "1.77"

[lib]
name = "dictation_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
thiserror = "2"
dotenvy = "0.15"
# Lesson exports. MP3s are already compressed, so storing entries uncompressed is enough.
zip = { version = "8", default-features = false }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

# iOS builds with Xcode 27: swift-rs 1.0.8 leaves its runtime helpers unlinkable
# (https://github.com/Brendonovich/swift-rs/issues/81). This commit is 1.0.8 plus
# the fix from swift-rs PR #80, which also needs SWIFT_RS_RUNTIME_ARCHIVE in the
# repository's .cargo/config.toml. Remove both once a swift-rs release includes the fix.
[patch.crates-io]
swift-rs = { git = "https://github.com/Brendonovich/swift-rs", rev = "aaf38d45ab3a4b10a5af3a3dbc64424e998fae8c" }
