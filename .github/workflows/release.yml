name: Release

# Builds DictationApp for macOS, Windows and Linux and attaches the installers
# to the GitHub release of the tag. Runs when a version tag such as v1.2.3 is
# pushed, or when a release is published on GitHub.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]

# Publishing a release with a new tag fires both events above; build it once.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare the release
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.release.outputs.id }}
    steps:
      - name: Check the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Windows installers (MSI) accept only plain numeric versions.
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must look like v1.2.3, not '$TAG'."
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Find or create the release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # A release published on GitHub already exists. For a pushed tag,
          # create a draft; the last job publishes it once every build worked.
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            --jq "map(select(.tag_name == \"$TAG\")) | first | .id // empty")
          if [ -z "$id" ]; then
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" \
              -f name="DictationApp $TAG" \
              -f body="$(cat .github/release-notes.md)" \
              -F draft=true \
              --jq .id)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Build for ${{ matrix.name }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-latest
            # One app that runs on both Apple Silicon and Intel Macs.
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Windows
            runner: windows-latest
          - name: Linux
            # The oldest supported Ubuntu, so the packages also run on older distributions.
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Take the version from the tag
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Installers are named and versioned after tauri.conf.json: v1.2.3 -> 1.2.3.
          node -e '
            const fs = require("fs");
            const file = "src-tauri/tauri.conf.json";
            const config = JSON.parse(fs.readFileSync(file, "utf8"));
            config.version = process.env.TAG.replace(/^v/, "");
            fs.writeFileSync(file, JSON.stringify(config, null, 2) + "\n");
          '

      - name: Build and upload the installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.prepare.outputs.release-id }}
          args: ${{ matrix.args }}

  publish:
    name: Publish the release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.prepare.outputs.release-id }}
        # Already published if it was released on GitHub; then this changes nothing.
        run: gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false --silent
